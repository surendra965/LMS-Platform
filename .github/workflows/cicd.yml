name: LMS CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend install
        working-directory: lms-backend
        run: npm ci

      - name: Frontend install
        working-directory: lms-frontend
        run: npm ci
