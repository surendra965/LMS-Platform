name: LMS CI/CD

on:
  push:
    branches:
      - main

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Backend install
        working-directory: lms-backend
        run: npm ci

      - name: Frontend install
        working-directory: lms-frontend
        run: npm ci

      - name: Build backend Docker image
        run: docker build -t surendra1211/lms-backend:latest ./lms-backend

      - name: Build frontend Docker image
        run: docker build -t surendra1211/lms-frontend:latest ./lms-fronted

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Push backend image
        run: docker push surendra1211/lms-backend:latest

      - name: Push frontend image
        run: docker push surendra1211/lms-frontend:latest
