name: LMS CI/CD

on:
  push:
    branches:
      - main

# Required for GitHub OIDC authentication with AWS
permissions:
  id-token: write
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout source code
      # =========================================================
      - name: Checkout code
        uses: actions/checkout@v4


      # =========================================================
      # 2. Setup Node.js
      # =========================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # =========================================================
      # 3. CI - Install backend dependencies
      # =========================================================
      - name: Backend install
        working-directory: lms-backend
        run: npm ci


      # =========================================================
      # 4. CI - Install frontend dependencies
      # =========================================================
      - name: Frontend install
        working-directory: lms-frontend
        run: npm ci


      # =========================================================
      # 5. Build backend Docker image
      # =========================================================
      - name: Build backend Docker image
        run: |
          docker build \
            -t surendra1211/lms-backend:latest \
            ./lms-backend


      # =========================================================
      # 6. Build frontend Docker image
      #
      # Empty VITE_API_URL is intentional.
      # Nginx inside the frontend container proxies /api
      # requests to the backend Kubernetes service.
      # =========================================================
      - name: Build frontend Docker image
        run: |
          docker build \
            --build-arg VITE_API_URL="" \
            -t surendra1211/lms-frontend:latest \
            ./lms-frontend


      # =========================================================
      # 7. Login to Docker Hub
      # =========================================================
      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}


      # =========================================================
      # 8. Push backend image
      # =========================================================
      - name: Push backend image
        run: |
          docker push surendra1211/lms-backend:latest


      # =========================================================
      # 9. Push frontend image
      # =========================================================
      - name: Push frontend image
        run: |
          docker push surendra1211/lms-frontend:latest


      # =========================================================
      # 10. Authenticate to AWS using GitHub OIDC
      # =========================================================
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::496336473993:role/GitHubActions-EKS-Deploy-Role
          aws-region: ap-south-1


      # =========================================================
      # 11. Connect kubectl to EKS
      # =========================================================
      - name: Update kubeconfig
        run: |
          aws eks update-kubeconfig \
            --region ap-south-1 \
            --name lms-eks


      # =========================================================
      # 12. CD - Deploy backend
      # =========================================================
      - name: Deploy backend to EKS
        run: |
          kubectl set image deployment/lms-backend \
            lms-backend=surendra1211/lms-backend:latest \
            -n lms


      # =========================================================
      # 13. CD - Deploy frontend
      # =========================================================
      - name: Deploy frontend to EKS
        run: |
          kubectl set image deployment/lms-frontend \
            lms-frontend=surendra1211/lms-frontend:latest \
            -n lms


      # =========================================================
      # 14. Verify backend rollout
      # =========================================================
      - name: Verify backend rollout
        run: |
          kubectl rollout status \
            deployment/lms-backend \
            -n lms


      # =========================================================
      # 15. Verify frontend rollout
      # =========================================================
      - name: Verify frontend rollout
        run: |
          kubectl rollout status \
            deployment/lms-frontend \
            -n lms